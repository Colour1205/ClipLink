<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="40" height="40" fill="none">
  <!-- The empty "Nothing synced yet" mark, drawn to the proportions of the
       Windows app's: a clipboard outline that is open at the bottom and on
       the right (a short stub each way), a wide pill for the clip centred on
       its top edge, and a page standing lower right with its bottom level with
       the board's. One muted tone, and no fills, so nothing is theme
       dependent. -->
  <g stroke="#000000" stroke-opacity="0.45" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path d="M184 60H110A50 50 0 0 0 60 110V570A50 50 0 0 0 110 620H219"/>
    <path d="M374 60H449A50 50 0 0 1 499 110V140"/>
    <rect x="184" y="20" width="190" height="80" rx="40"/>
    <rect x="301" y="220" width="278" height="400" rx="40"/>
  </g>
</svg>
