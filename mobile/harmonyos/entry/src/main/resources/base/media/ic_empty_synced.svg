<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- The empty "Nothing synced yet" mark: a plain outline clipboard with a
       page in front, one muted tone, like the Windows app's. The board's
       outline is left open where the clip and the page sit on it, so no
       line shows through them and nothing needs a theme-dependent fill. -->
  <g stroke="#000000" stroke-opacity="0.45" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 14H37A5 5 0 0 1 42 19V26"/>
    <path d="M32 56H15A5 5 0 0 1 10 51V19A5 5 0 0 1 15 14H20"/>
    <rect x="20" y="8" width="12" height="10" rx="3"/>
    <rect x="28" y="26" width="26" height="30" rx="4"/>
  </g>
</svg>
