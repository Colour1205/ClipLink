[versions]
agp = "9.4.1"
kotlin = "2.2.10"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
# M3 Expressive does NOT exist in the stable Compose BOM - material3 1.4.x
# ships zero expressive APIs. MaterialExpressiveTheme, MotionScheme,
# expressiveLightColorScheme and the floating toolbars only exist from
# material3 1.5.0-alpha onward, which is what the ALPHA bom pins. This is a
# deliberate, load-bearing choice: dropping to the stable bom silently
# removes every expressive API this app's UI is built on.
composeBomAlpha = "2026.09.00"
kotlinxCoroutines = "1.9.0"
zxing = "3.5.3"
camerax = "1.4.1"
junit = "4.13.2"
junitVersion = "1.2.1"
androidJson = "0.0.20131108.vaadin1"
espressoCore = "3.6.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom-alpha", version.ref = "composeBomAlpha" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

# CameraX - for the pairing screen's "Scan a Device's Code" QR scanner.
# camera-view's PreviewView gives a ready-made SurfaceView-backed preview
# instead of hand-rolling one; the actual decode still goes through
# zxing-core (already a dependency for QR display) via an ImageAnalysis
# analyzer, rather than pulling in a whole second barcode-scanning library.
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
# Local unit tests run against a stubbed android.jar whose org.json throws
# "not mocked", so they need a real implementation - and it has to be
# Android's own. The canonical org.json:json returns the fallback for a JSON
# null in optString, where Android returns the text "null"; testing against
# it would hide exactly the null-field bugs InteropTest guards against.
android-json = { group = "com.vaadin.external.google", name = "android-json", version.ref = "androidJson" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
